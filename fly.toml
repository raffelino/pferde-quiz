# Beispielkonfiguration für fly.io. Andere Anbieter brauchen nur das Dockerfile
# und ein beständiges Verzeichnis für die SQLite-Datei.
app = "reitabzeichen-trainer"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  DB_PATH = "/data/trainer.db"
  NODE_ENV = "production"
  TRUST_PROXY = "1"

# GOOGLE_CLIENT_ID als Secret setzen:
#   fly secrets set GOOGLE_CLIENT_ID=...apps.googleusercontent.com

# WICHTIG: genau EINE Maschine.
#
# Die gesamte Datenlage steckt in einer SQLite-Datei auf dem Volume, und ein
# Volume gehört immer genau einer Maschine. Legt fly zwei an (das ist beim
# ersten Deploy die Voreinstellung), entstehen zwei getrennte Datenbanken:
# Wer sich anmeldet, landet mal hier, mal dort und sieht unterschiedliche
# Lernstände – ohne dass irgendwo ein Fehler auftaucht.
#
# Deshalb immer mit "--ha=false" ausliefern und einmal "fly scale count 1"
# prüfen. Erst wenn es echte Ausfallsicherheit braucht, wird aus SQLite
# Postgres – nicht aus SQLite auf zwei Volumes.
[[mounts]]
  source = "trainer_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"
