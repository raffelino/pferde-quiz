name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Laufende Deployments nicht abbrechen, aber nur eines gleichzeitig zulassen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Voraussetzung: In den Repository-Einstellungen unter "Pages" muss als
      # Source "GitHub Actions" gewählt sein. Das kann der Workflow nicht selbst
      # einschalten (der GITHUB_TOKEN darf keine Pages-Site anlegen).
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Auf Pages läuft nur die statische App. Damit sich dort trotzdem
      # jemand anmelden kann, muss sie wissen, wo die API liegt. Adresse unter
      # Settings -> Secrets and variables -> Actions -> Variables als
      # API_BASE_URL hinterlegen (z. B. https://api.example.com).
      # Ohne die Variable bleibt es beim bisherigen Verhalten: rein lokal.
      - name: Adresse der API eintragen
        if: vars.API_BASE_URL != ''
        run: node tools/set-api-base.mjs "${{ vars.API_BASE_URL }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Die App ist eine statische Seite ohne Build-Schritt.
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
